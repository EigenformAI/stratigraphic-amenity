[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stratigraphic-amenity"
version = "0.1.0"
description = "Composable geologic-map processing, georeferencing, knowledge, and MCP services."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
maintainers = [{ name = "Stratigraphic Amenity maintainers" }]
keywords = ["geology", "geologic-maps", "georeferencing", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/EigenformAI/stratigraphic-amenity"
Documentation = "https://github.com/EigenformAI/stratigraphic-amenity/tree/main/docs"
Issues = "https://github.com/EigenformAI/stratigraphic-amenity/issues"

[project.optional-dependencies]
assets = [
    "gdown>=5,<6",
]
detectors = [
    "huggingface-hub>=0.24,<1",
    "matplotlib==3.9.2",
    "numpy==1.26.4",
    "opencv-python-headless==4.10.0.84",
    "pandas==2.2.2",
    "pillow==11.0.0",
    "psutil==6.0.0",
    "py-cpuinfo==9.0.0",
    "pyyaml>=6,<7",
    "requests>=2,<3",
    "torch==2.0.1",
    "torchvision==0.15.2",
    "tqdm==4.66.5",
]
knowledge-earthengine = [
    "earthengine-api>=1.7.37,<2",
]
knowledge-local = [
    "pandas==2.2.2",
    "shapely>=2,<3",
]
knowledge-network = [
    "httpx>=0.27,<1",
]
knowledge-semantic = [
    "sentence-transformers>=5.6.1,<6",
    # transformers>=4.56 (pulled by sentence-transformers>=5) needs torch>=2.1 for
    # torch.compiler. Detectors pins torch==2.0.1 for the validated YOLO pipeline, so
    # these two extras are declared conflicting under [tool.uv] to allow divergent torch.
    "torch>=2.2,<3",
]
geo = [
    "numpy==1.26.4",
    "pyproj>=3.4,<4",
]
mcp = [
    "jsonschema>=4.23,<5",
    "mcp>=1.12,<2",
    "pillow==11.0.0",
]

[project.scripts]
stratigraphic-amenity-assets = "stratigraphic_amenity.asset_installer:main"
stratigraphic-amenity-mcp = "stratigraphic_amenity.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stratigraphic_amenity"]

[tool.hatch.build.targets.wheel.force-include]
"assets/manifest.toml" = "stratigraphic_amenity/data/manifest.toml"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/assets",
    "/docs",
    "/examples",
    "/scripts/install_assets.py",
    "/.env.example",
    "/.envrc.example",
    "/AGENTS.md",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/pyproject.toml",
]
exclude = ["/docs/design", "/docs/benchmarks", "/scripts/benchmarks", "/runs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
package = true
default-groups = []

# The detectors (YOLO) stack is pinned to torch==2.0.1, while knowledge-semantic
# needs torch>=2.1. They cannot share a single resolved torch, so they are declared
# mutually exclusive: install at most one of these extras in a given environment.
conflicts = [
    [
        { extra = "detectors" },
        { extra = "knowledge-semantic" },
    ],
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "detectors" }]
torchvision = [{ index = "pytorch-cpu", extra = "detectors" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
