version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    target-branch: main
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python
    commit-message:
      prefix: deps
    groups:
      development-tools:
        dependency-type: development
      patch-runtime-updates:
        dependency-type: production
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    target-branch: main
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
